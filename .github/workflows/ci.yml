name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_saas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_user:app_user_dev@localhost:5433/restaurant_saas_test
      DATABASE_MIGRATION_URL: postgresql://app_owner:app_owner_dev@localhost:5433/restaurant_saas_test
      DATABASE_WORKER_URL: postgresql://app_worker:app_worker_dev@localhost:5433/restaurant_saas_test
      E2E_DATABASE_URL: postgresql://app_user:app_user_dev@localhost:5433/restaurant_saas_test
      E2E_DATABASE_MIGRATION_URL: postgresql://app_owner:app_owner_dev@localhost:5433/restaurant_saas_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      APP_ROLE: api
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-min-32-chars-long
      COOKIE_SECURE: 'false'
      SEED_PASSWORD: ci-seed-password-123456

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Init DB roles
        run: psql postgresql://postgres:postgres@localhost:5433/restaurant_saas_test -f infra/postgres/init/01-roles.sql

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
