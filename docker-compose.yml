# Default local dev: use your existing Postgres + Redis (e.g. ~/docker/local-db).
# See README.md — bootstrap with scripts/bootstrap-postgres.sh
#
# Only if you do NOT have Postgres/Redis elsewhere:
#   docker compose --profile bundled up -d

services:
  postgres:
    profiles: ['bundled']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    profiles: ['bundled']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_saas_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    profiles: ['bundled']
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
